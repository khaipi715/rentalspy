# Every quarter (the SA rent report comes out about 7 weeks after each quarter), download the latest
# public data and commit it. Your host rebuilds the site automatically when this commits.
name: Refresh public data
on:
  schedule:
    - cron: '23 2 25 2,5,8,11 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - run: python3 data-pipeline/build_data.py
      - name: Commit if anything changed
        run: |
          git config user.name "rentalspy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data public/data
          git diff --cached --quiet || git commit -m "Refresh public rent, crime and address data"
          git push
